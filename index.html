<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPortal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #eef2ff;
            --card: #ffffff;
            --border: rgba(0,0,0,0.08);
            --accent: #5b8dee;
            --text: #1a1f36;
            --muted: #6b7280;
            --input-bg: #f4f6fb;
            --top-bg: #dce8ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            background-image: url('BG.png');
            font-family: 'DM Sans', sans-serif;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 420px;
            max-width: 90vw;
            box-shadow: 0 15px 50px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-section {
            background: var(--top-bg);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .top-section img {
            width: 160px;
            height: auto;
            margin-bottom: 20px;
        }

        .top-section h1 {
            font-family: 'DM Serif Display', serif;
            color: var(--text);
            font-size: 26px;
            margin-bottom: 8px;
        }

        .top-section p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .bottom-section {
            padding: 40px;
        }

        h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 30px;
            color: var(--text);
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(91, 141, 238, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #4a7de0;
            transform: translateY(-1px);
        }

        .signup {
            text-align: center;
            font-size: 14px;
            color: var(--muted);
            margin-top: 25px;
        }

        .signup a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

         .footer-bar {
  position: fixed;
  bottom: 0;
  right: 0;
  width: calc(100% - 240px); 
  background: rgba(255, 255, 255, 0.4); 
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #1e293b;
  padding: 8px 25px;
  font-size: 13px;
  font-weight: 500;
  text-align: right;
  border-top: 1px solid rgba(255, 255, 255, 0.3);
  z-index: 90;
}

@media (max-width: 768px) {
  .footer-bar {
    width: 100%; 
  }
}

    </style>
</head>
<body>

<div class="card">
    <div class="top-section">
        <img src="Logo.png" alt="EduPortal Logo">
        <h1>EduPortal</h1>
        <p>A building with four walls<br/>and tomorrow inside.</p>
    </div>

    <div class="bottom-section">
        <h2>Login</h2>
        <p class="subtitle">Sign in to continue</p>

        <form onsubmit="login(event)">
            <div class="field">
                <label>Username</label>
                <input type="text" id="username" placeholder="Student17" required>
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••••••" required>
            </div>

            <button type="submit" id="loginBtn">Sign in</button>
        </form>

        <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
    </div>
</div>

<script>
    const CorrectUser = "Student17";
    const CorrectPass = "EduPortalStudent17";

    let attempts = 0;
    const MaxTry = 3;

    function login(event) {
        event.preventDefault();

        const userField = document.getElementById("username");
        const passField = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");

        const User = userField.value;
        const Pass = passField.value;

        if (attempts < MaxTry) {
            if (User === CorrectUser && Pass === CorrectPass) {
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("username", User);
                
                alert("Login successful!");
                window.location.href = "Notebooks.html"; 
            } else {
                attempts++;
                if (attempts < MaxTry) {
                    alert("Incorrect credentials. Attempts left: " + (MaxTry - attempts));
                }
            }
        }

        if (attempts === MaxTry) {
            alert("Account locked due to too many failed attempts.");
            loginBtn.disabled = true;
            loginBtn.style.opacity = "0.5";
            loginBtn.innerText = "Locked";
            userField.disabled = true;
            passField.disabled = true;
        }
    }
</script>

<div class="footer-bar">
  <span id="footerName">Decierto, Tecson, Espiritu, Cabonilas</span> 
  <span class="mx-2">|</span> 
  Grade 9 - Emerald 
  <span class="mx-2">|</span> 
  AY 2025-2026
</div>

</body>
</html>
