<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emerald - Profile</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f7cff;
      --accent: #00d2ff;
      --glass: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.4);
      --sidebar-bg: linear-gradient(180deg, #0f172a, #020617);
    }

    * {
      font-family: 'DM Sans', sans-serif;
      margin: 0; padding: 0; box-sizing: border-box;
    }

    body {
      display: flex;
      min-height: 100vh;
      background: linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)), url('BG.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
            background-image: url('BG.png');

    }

    
    .sidebar {
      width: 240px;
      background: var(--sidebar-bg);
      color: white;
      padding: 25px 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      box-shadow: 4px 0 20px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .logo img {
      width: 150px;
      display: block;
      margin: 0 auto 30px;
    }

    .nav-link {
      color: #cbd5f5;
      margin-bottom: 10px;
      border-radius: 10px;
      padding: 10px;
      transition: 0.25s;
      text-decoration: none;
      display: block;
      font-size: 15px;
    }

    .nav-link:hover {
      background: rgba(79,124,255,0.2);
      color: #fff;
      transform: translateX(5px);
    }

    .active-link {
      background: #4f7cff;
      color: white !important;
    }

    .main {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      align-items: flex-start;
      margin-bottom: 30px;
    }

    .page-indicator {
      background: #1e293b;
      color: white;
      padding: 8px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: inline-block;
    }

    .avatar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-right: 50px;
      margin-top: 20px;
    }

    .avatar-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #eee;
      overflow: hidden;
      border: 5px solid white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .file-input-wrapper {
      font-size: 13px;
      color: #64748b;
    }

    .info-card {
      background: var(--glass);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 25px;
      padding: 40px;
      flex: 1;
      max-width: 500px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    }

    .info-card h2 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 25px;
    }

    .info-group {
      margin-bottom: 20px;
    }

    .info-label {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 16px;
      color: #1e293b;
      font-weight: 500;
    }

    .btn-password {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 700;
      width: 100%;
      margin-top: 10px;
      transition: 0.3s ease;
    }

    .btn-password:hover {
      background: #00b8e6;
      box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
    }

    .footer-bar {
  position: fixed;
  bottom: 0;
  right: 0;
  width: calc(100% - 240px); 
  background: rgba(255, 255, 255, 0.4); 
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #1e293b;
  padding: 8px 25px;
  font-size: 13px;
  font-weight: 500;
  text-align: right;
  border-top: 1px solid rgba(255, 255, 255, 0.3);
  z-index: 90;
}

@media (max-width: 768px) {
  .footer-bar {
    width: 100%; 
  }
}


  </style>
</head>

<body>

<nav class="sidebar d-flex flex-column">
  <div class="logo">
    <img src="Logo.png" alt="Logo">
  </div>

  <a href="Dashboard.html" class="nav-link">Dashboard</a>
  <a href="Notebooks.html" class="nav-link">Virtual Notebooks</a>
  <a href="Tasks.html" class="nav-link">Tasks</a>
  <a href="Profile.html" class="nav-link active-link">Profile</a>
  
  <a href="javascript:void(0)" class="nav-link mt-auto" onclick="logout()">Logout</a>
</nav>

<div class="main">
  <div class="profile-header">
    <div class="header-left">
      <div class="page-indicator">PROFILE</div>
      <p class="text-muted ms-1">Student Information</p>
    </div>
  </div>

  <div class="d-flex align-items-center justify-content-center w-100">
    <div class="avatar-wrapper">
      <div class="avatar-circle">
        <img src="Avatar.png" alt="Student Profile">
      </div>
      <div class="file-input-wrapper">
        <input type="file" class="form-control form-control-sm">
      </div>
    </div>

    <div class="info-card">
      <h2>Student Information</h2>
      
      <div class="info-group">
        <div class="info-label">Student ID</div>
        <div class="info-value">SN123456</div>
      </div>

      <div class="info-group">
        <div class="info-label">Contact Number</div>
        <div class="info-value">+639150000001</div>
      </div>

      <div class="info-group">
        <div class="info-label">Email Address</div>
        <div class="info-value">delacruz.jr@obmontessori.edu.ph</div>
      </div>

      <div class="info-group">
        <div class="info-label">Gender</div>
        <div class="info-value">Male</div>
      </div>

      <button class="btn-password">Change Password</button>
    </div>
  </div>
</div>

<script>
  function logout() {
    localStorage.removeItem("isLoggedIn");
    localStorage.removeItem("username");
    window.location.href = "index.html";
  }
</script>

<div class="footer-bar">
  <span id="footerName">Decierto, Tecson, Espiritu, Cabonilas</span> 
  <span class="mx-2">|</span> 
  Grade 9 - Emerald 
  <span class="mx-2">|</span> 
  AY 2025-2026
</div>

</body>
</html>
